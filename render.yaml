services:
  - type: web
    name: shivshakti-furnitures
    runtime: static
    buildCommand: python build_public.py
    staticPublishPath: ./public
  - type: web
    name: shivshakti-cms
    runtime: python
    plan: starter
    buildCommand: python build_public.py
    startCommand: python server.py
    disk:
      name: cms-content
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CMS_REQUIRE_AUTH
        value: "true"
      - key: CMS_DATA_FILE
        value: /var/data/site-content.json
      - key: CMS_ADMIN_ORIGIN
        value: https://shivshakti-cms.onrender.com
      - key: CMS_PUBLIC_ORIGIN
        value: https://shivshakti-furnitures.onrender.com
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
