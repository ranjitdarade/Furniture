services:
  - type: web
    name: shivshakti-furnitures
    runtime: static
    buildCommand: python build_public.py
    staticPublishPath: ./public
    buildFilter:
      ignoredPaths:
        - site-content.json
  - type: web
    name: shivshakti-cms
    runtime: python
    plan: free
    buildCommand: python build_public.py
    startCommand: python server.py
    buildFilter:
      ignoredPaths:
        - site-content.json
    envVars:
      - key: CMS_REQUIRE_AUTH
        value: "true"
      - key: CMS_ADMIN_ORIGIN
        value: https://shivshakti-cms.onrender.com
      - key: CMS_PUBLIC_ORIGIN
        value: https://shivshakti-furnitures.onrender.com
      - key: GITHUB_REPOSITORY
        value: ranjitdarade/Furniture
      - key: GITHUB_CONTENT_PATH
        value: site-content.json
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
